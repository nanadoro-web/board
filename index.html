<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학급 대시보드</title>
<style>
  /* Android 8 WebView 호환: flexbox만 사용, grid/gap 미사용 */
  :root {
    --board: #0D2350;
    --panel: #15336F;
    --panel-hi: #1C3F86;
    --line: rgba(244, 246, 251, 0.13);
    --chalk: #F4F6FB;
    --chalk-dim: #A8B7D6;
    --yellow: #F4C542;
    --pink: #FF9E97;
    --blue: #8FC4FF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 1.85vh; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--board);
    color: var(--chalk);
    font-family: "Noto Sans CJK KR", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; }

  .app { display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; height: 100%; padding: 1.4rem 1.8rem 1rem; }

  /* 상단 */
  .top { display: -webkit-flex; display: flex; -webkit-align-items: flex-end; align-items: flex-end; -webkit-justify-content: space-between; justify-content: space-between; padding-bottom: 1rem; border-bottom: 2px solid var(--line); }
  .brand { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; background: none; border: 0; text-align: left; }
  .brand img { height: 4.8rem; width: auto; margin-right: 1.1rem; }
  .school { font-size: 1.15rem; color: var(--chalk-dim); letter-spacing: 0.08em; }
  .classname { font-size: 2.6rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .now { text-align: right; }
  .top-right { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  .tool-btn { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 2.6rem; height: 4.6rem; min-width: 4.6rem; padding: 0 1.1rem; margin-right: 1.4rem; }
  .tool-btn:active { background: var(--panel-hi); }
  .tool-btn svg { width: 2.4rem; height: 2.4rem; }
  .tool-btn .tool-run { font-size: 1.7rem; font-weight: 700; margin-left: 0.6rem; display: none; font-variant-numeric: tabular-nums; }
  .tool-btn.running { border-color: var(--yellow); }
  .tool-btn.running .tool-run { display: inline; color: var(--yellow); }

  /* 스톱워치·타이머 */
  .tm-bg { display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 20; background: #081634; -webkit-flex-direction: column; flex-direction: column; padding: 2rem 2.6rem; }
  .tm-bg.open { display: -webkit-flex; display: flex; }
  .tm-top { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  .tm-tab { font-size: 1.9rem; font-weight: 700; padding: 0.7rem 2.2rem; border-radius: 3rem; border: 2px solid var(--chalk-dim); background: transparent; color: var(--chalk-dim); margin-right: 1rem; }
  .tm-tab.on { background: var(--yellow); border-color: var(--yellow); color: var(--board); }
  .tm-close { margin-left: auto; font-size: 2.4rem; width: 4.6rem; height: 4.6rem; border-radius: 2.3rem; border: 2px solid var(--chalk-dim); background: transparent; line-height: 1; }
  .tm-body { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
  .tm-label { font-size: 2rem; color: var(--chalk-dim); margin-bottom: 0.5rem; min-height: 2.6rem; }
  .tm-label.done { font-size: 3.2rem; font-weight: 800; color: var(--pink); }
  .tm-digits { font-size: 21rem; font-weight: 800; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tm-digits small { font-size: 0.45em; color: var(--chalk-dim); margin-left: 0.15em; }
  .tm-digits.warn { color: var(--yellow); }
  .tm-digits.done { color: var(--pink); -webkit-animation: tmblink 0.8s steps(2) infinite; animation: tmblink 0.8s steps(2) infinite; }
  @-webkit-keyframes tmblink { 50% { opacity: 0.25; } }
  @keyframes tmblink { 50% { opacity: 0.25; } }
  .tm-presets { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; -webkit-justify-content: center; justify-content: center; margin-top: 1.6rem; min-height: 4.4rem; }
  .tm-preset { font-size: 1.6rem; padding: 0.6rem 1.5rem; margin: 0 0.4rem 0.6rem; border-radius: 0.7rem; border: 1px solid var(--chalk-dim); background: var(--panel); }
  .tm-preset:active { background: var(--panel-hi); }
  .tm-inputs { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  .tm-inputs input { width: 9rem; font-size: 3.4rem; font-weight: 700; text-align: center; padding: 0.4rem 0.6rem; border-radius: 0.8rem; border: 2px solid var(--chalk-dim); background: var(--panel); color: var(--chalk); font-family: inherit; }
  .tm-inputs input::-webkit-inner-spin-button, .tm-inputs input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .tm-inputs input { -moz-appearance: textfield; }
  .tm-inputs input:focus { outline: none; border-color: var(--yellow); }
  .tm-inputs span { font-size: 2.2rem; color: var(--chalk-dim); margin: 0 1.4rem 0 0.6rem; }
  .tm-ctrls { display: -webkit-flex; display: flex; -webkit-justify-content: center; justify-content: center; margin-top: 1.6rem; }
  .tm-btn { font-size: 2.3rem; font-weight: 700; min-width: 13rem; padding: 1rem 2.4rem; margin: 0 0.8rem; border-radius: 1rem; border: 2px solid var(--chalk-dim); background: var(--panel); }
  .tm-btn.go { background: var(--yellow); border-color: var(--yellow); color: var(--board); }
  .tm-btn:disabled { opacity: 0.35; }
  .now-date { font-size: 1.5rem; color: var(--chalk-dim); }
  .now-time { font-size: 3.4rem; font-weight: 700; line-height: 1; letter-spacing: -0.02em; margin-top: 0.2rem; }

  .main { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; min-height: 0; padding-top: 1.2rem; }

  /* 캘린더 */
  .cal { -webkit-flex: 1.55; flex: 1.55; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; min-width: 0; margin-right: 1.4rem; }
  .cal-head { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; margin-bottom: 0.8rem; }
  .cal-title { font-size: 2rem; font-weight: 700; margin-right: auto; }
  .navbtn { background: var(--panel); border: 1px solid var(--line); border-radius: 0.5rem; font-size: 1.2rem; padding: 0.35rem 1rem; margin-left: 0.5rem; min-width: 3.2rem; }
  .navbtn:active { background: var(--panel-hi); }
  .dow { display: -webkit-flex; display: flex; }
  .dow div { -webkit-flex: 1; flex: 1; text-align: center; font-size: 1.05rem; color: var(--chalk-dim); padding-bottom: 0.4rem; }
  .dow .sun { color: var(--pink); } .dow .sat { color: var(--blue); }
  .weeks { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
  .week { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; min-height: 0; }
  .day { -webkit-flex: 1; flex: 1; min-width: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0.35rem 0.45rem; overflow: hidden; position: relative; }
  .day:active { background: var(--panel-hi); }
  .day.other { opacity: 0.35; }
  .day-num { font-size: 1.15rem; font-weight: 700; display: inline-block; min-width: 1.9rem; height: 1.9rem; line-height: 1.9rem; text-align: center; border-radius: 1rem; }
  .day.sat .day-num { color: var(--blue); }
  .day.sun .day-num, .day.holi .day-num { color: var(--pink); }
  .day.today { background: rgba(143, 196, 255, 0.12); }
  .day.today .day-num { background: var(--yellow); color: var(--board); }
  .holi-name { font-size: 0.8rem; color: var(--pink); margin-left: 0.2rem; display: inline-block; max-width: calc(100% - 2.4rem); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
  .ev { font-size: 0.95rem; line-height: 1.35; margin-top: 0.2rem; padding: 0.05rem 0.35rem; border-left: 3px solid var(--yellow); background: rgba(244, 246, 251, 0.07); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev.range { border-left: 0; background: rgba(143, 196, 255, 0.26); margin-left: -0.45rem; margin-right: -0.45rem; padding-left: 0.8rem; border-radius: 0; }
  .ev.range.first { margin-left: 0; padding-left: 0.35rem; border-radius: 0.35rem 0 0 0.35rem; }
  .ev.range.last { margin-right: 0; border-radius: 0 0.35rem 0.35rem 0; }
  .ev.range.first.last { border-radius: 0.35rem; }
  .ev.range.cont { color: transparent; }
  .m-dates { -webkit-flex-wrap: nowrap; flex-wrap: nowrap; }
  .m-field { display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-flex: 1; flex: 1; margin-right: 0.6rem; }
  .m-field:last-child { margin-right: 0; }
  .m-field span { font-size: 1rem; color: #5E6B85; margin-bottom: 0.3rem; }
  .m-form .m-field input { -webkit-flex: none; flex: none; width: 100%; min-width: 0; margin: 0 0 0.6rem 0; }
  .m-check { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; font-size: 1.25rem; margin-top: 0.2rem; }
  .m-check input { width: 1.6rem; height: 1.6rem; margin-right: 0.6rem; }
  .tag-red { color: #C0392B; font-weight: 700; }
  .m-row.editing { background: #FFF6D6; }
  .m-label { width: 100%; font-size: 1rem; color: #5E6B85; margin-bottom: 0.3rem; }
  .ev-more { font-size: 0.85rem; color: var(--chalk-dim); margin-top: 0.15rem; }

  /* 오른쪽 */
  .side { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; min-width: 0; }
  .dday { background: var(--panel); border-radius: 0.8rem; padding: 1rem 1.5rem; margin-bottom: 1rem; }
  .dday:active, .notice:active { background: var(--panel-hi); }
  .dday-main { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: space-between; justify-content: space-between; }
  .dday-name { font-size: 1.6rem; font-weight: 700; }
  .dday-date { font-size: 1.1rem; color: var(--chalk-dim); margin-top: 0.2rem; }
  .dday-big { font-size: 4.4rem; font-weight: 800; color: var(--yellow); line-height: 1; letter-spacing: -0.04em; }
  .dday-list { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin-top: 0.7rem; border-top: 1px solid var(--line); padding-top: 0.5rem; }
  .dday-row { font-size: 1.15rem; margin-right: 1.6rem; padding: 0.15rem 0; white-space: nowrap; }
  .dday-row b { color: var(--yellow); margin-left: 0.4rem; }
  .notice { -webkit-flex: 1; flex: 1; min-height: 0; background: var(--panel); border-radius: 0.8rem; padding: 1.2rem 1.5rem; overflow: hidden; position: relative; }
  .notice .mark { position: absolute; right: -1.5rem; bottom: -2rem; height: 14rem; opacity: 0.06; pointer-events: none; }
  .notice-item { position: relative; }
  .panel-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.8rem; }
  .notice-item { font-size: 1.35rem; line-height: 1.4; padding: 0.15rem 0 0.15rem 0.9rem; border-left: 4px solid var(--chalk-dim); margin-bottom: 0.4rem; word-break: keep-all; }
  .empty { font-size: 1.2rem; color: var(--chalk-dim); line-height: 1.5; }

  .notice + .notice { margin-top: 1rem; }
  #noticeBox { -webkit-flex: 1.35; flex: 1.35; }
  .notice .panel-title { margin-bottom: 0.5rem; }
  .meal { background: var(--panel); border-radius: 0.8rem; padding: 1rem 1.5rem; margin-bottom: 1rem; height: 12.5rem; overflow: hidden; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .meal-head { display: -webkit-flex; display: flex; -webkit-align-items: baseline; align-items: baseline; margin-bottom: 0.5rem; }
  .meal-head .panel-title { margin-bottom: 0; margin-right: 0.7rem; }
  .meal-when { font-size: 1.05rem; color: var(--chalk-dim); margin-right: auto; }
  .meal-tab { font-size: 1.05rem; padding: 0.2rem 0.9rem; border-radius: 1rem; border: 1px solid var(--chalk-dim); background: transparent; color: var(--chalk-dim); margin-left: 0.4rem; }
  .meal-tab.on { background: var(--yellow); border-color: var(--yellow); color: var(--board); font-weight: 700; }
  .meal-menu { font-size: 1.3rem; line-height: 1.55; word-break: keep-all; }
  .meal-menu .dot { color: var(--yellow); margin: 0 0.45rem; }
  .meal-type { display: inline-block; font-size: 0.95rem; color: var(--board); background: var(--chalk-dim); border-radius: 0.3rem; padding: 0 0.4rem; margin-right: 0.5rem; vertical-align: 0.15rem; }
  .meal-row + .meal-row { margin-top: 0.3rem; }
  .panel-title .lock { font-size: 0.95rem; font-weight: 400; color: var(--chalk-dim); margin-left: 0.5rem; }
  .memo-text { font-size: 1.35rem; line-height: 1.5; white-space: pre-wrap; word-break: keep-all; }
  .pw-err { color: #A33A33; font-size: 1.1rem; min-height: 1.5rem; margin-top: 0.3rem; }
  .foot .admin-trig { cursor: pointer; }
  .admin-ok { color: #1E7B34; font-size: 1.1rem; min-height: 1.5rem; margin-top: 0.3rem; }
  .foot { font-size: 0.9rem; color: var(--chalk-dim); text-align: right; padding-top: 0.6rem; opacity: 0.7; }
  .warn { color: var(--pink); }

  /* 편집창 */
  .modal-bg { display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.55); z-index: 10; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
  .modal-bg.open { display: -webkit-flex; display: flex; }
  .modal { background: #F7F9FD; color: #14254A; width: 46rem; max-width: 92vw; max-height: 88vh; overflow-y: auto; border-radius: 0.9rem; padding: 1.6rem 1.8rem; }
  .modal h2 { font-size: 1.7rem; margin-bottom: 1rem; }
  .m-row { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 0.6rem 0; border-bottom: 1px solid #DCE2EE; font-size: 1.3rem; }
  .m-row span { -webkit-flex: 1; flex: 1; word-break: keep-all; }
  .m-row small { color: #5E6B85; margin-left: 0.6rem; font-size: 1rem; }
  .m-form { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin-top: 1rem; }
  .m-form input { -webkit-flex: 1; flex: 1; min-width: 10rem; font-size: 1.3rem; padding: 0.6rem 0.8rem; border: 1px solid #C3CCDD; border-radius: 0.5rem; margin: 0 0.6rem 0.6rem 0; font-family: inherit; }
  textarea { width: 100%; height: 16rem; font-size: 1.3rem; line-height: 1.5; padding: 0.8rem; border: 1px solid #C3CCDD; border-radius: 0.5rem; font-family: inherit; resize: none; }
  .hint { font-size: 1rem; color: #5E6B85; margin-bottom: 0.6rem; }
  .btn { font-size: 1.2rem; padding: 0.55rem 1.2rem; border-radius: 0.5rem; border: 1px solid #C3CCDD; background: #fff; margin-left: 0.5rem; }
  .btn.primary { background: #1A4FA8; color: #fff; border-color: #1A4FA8; }
  .btn.del { color: #A33A33; }
  .btn.star { color: #8A6D0B; }
  .btn.star.on { background: #F3D36B; border-color: #D9B64A; }
  .m-actions { display: -webkit-flex; display: flex; -webkit-justify-content: flex-end; justify-content: flex-end; margin-top: 1.2rem; }
  .m-empty { color: #5E6B85; font-size: 1.2rem; padding: 0.6rem 0; }
</style>
</head>

<script>
(function () {
  'use strict';

  var KEY = 'classDashboard.v1';
  var VERSION = '1.5';
  var ADMIN_PW = '0825';

  // ===== 급식 설정 =====
  var NEIS_KEY_STORE = 'classDashboard.neisKey';   // 인증키는 파일이 아니라 각 기기에 저장
  function getNeisKey() { try { return window.localStorage.getItem(NEIS_KEY_STORE) || ''; } catch (e) { return ''; } }
  function setNeisKey(k) { try { if (k) window.localStorage.setItem(NEIS_KEY_STORE, k); else window.localStorage.removeItem(NEIS_KEY_STORE); } catch (e) {} }
  var OFFICE_CODE = 'N10';          // 충청남도교육청
  var SCHOOL_NAME = '서령고등학교';
  var SCHOOL_CODE = '';             // 비워두면 학교 이름으로 자동 검색
  var MEAL_KEY = 'classDashboard.meal';
  var MEAL_TYPE_KEY = 'classDashboard.mealType';
  var EMBLEM = document.querySelector('#brand img').src;
  var WEEK = ['일', '월', '화', '수', '목', '금', '토'];

  // 공휴일 (대체공휴일 포함). 필요하면 여기서 추가·수정하세요.
  var HOLIDAYS = {
    '2026-01-01': '신정', '2026-02-16': '설날', '2026-02-17': '설날', '2026-02-18': '설날',
    '2026-03-01': '삼일절', '2026-03-02': '대체공휴일', '2026-05-01': '노동절', '2026-05-05': '어린이날',
    '2026-05-24': '부처님오신날', '2026-05-25': '대체공휴일', '2026-06-03': '지방선거',
    '2026-06-06': '현충일', '2026-07-17': '제헌절', '2026-08-15': '광복절', '2026-08-17': '대체공휴일',
    '2026-09-24': '추석', '2026-09-25': '추석', '2026-09-26': '추석',
    '2026-10-03': '개천절', '2026-10-05': '대체공휴일', '2026-10-09': '한글날', '2026-12-25': '성탄절',
    '2027-01-01': '신정', '2027-02-06': '설날', '2027-02-07': '설날', '2027-02-08': '설날', '2027-02-09': '대체공휴일',
    '2027-03-01': '삼일절', '2027-05-01': '노동절', '2027-05-03': '대체공휴일', '2027-05-05': '어린이날', '2027-05-13': '부처님오신날', '2027-06-06': '현충일', '2027-07-17': '제헌절', '2027-07-19': '대체공휴일',
    '2027-08-15': '광복절', '2027-08-16': '대체공휴일', '2027-09-14': '추석', '2027-09-15': '추석', '2027-09-16': '추석',
    '2027-10-03': '개천절', '2027-10-04': '대체공휴일', '2027-10-09': '한글날', '2027-10-11': '대체공휴일',
    '2027-12-25': '성탄절', '2027-12-27': '대체공휴일',
    '2028-01-01': '신정', '2028-01-26': '설날', '2028-01-27': '설날', '2028-01-28': '설날',
    '2028-03-01': '삼일절', '2028-04-12': '국회의원선거', '2028-05-01': '노동절', '2028-05-02': '부처님오신날',
    '2028-05-05': '어린이날', '2028-06-06': '현충일', '2028-07-17': '제헌절', '2028-08-15': '광복절',
    '2028-10-02': '추석', '2028-10-03': '추석·개천절', '2028-10-04': '추석', '2028-10-05': '대체공휴일',
    '2028-10-09': '한글날', '2028-12-25': '성탄절',
    '2029-01-01': '신정', '2029-02-12': '설날', '2029-02-13': '설날', '2029-02-14': '설날',
    '2029-03-01': '삼일절', '2029-05-01': '노동절', '2029-05-05': '어린이날', '2029-05-07': '대체공휴일',
    '2029-05-20': '부처님오신날', '2029-05-21': '대체공휴일', '2029-06-06': '현충일', '2029-07-17': '제헌절',
    '2029-08-15': '광복절', '2029-09-21': '추석', '2029-09-22': '추석', '2029-09-23': '추석', '2029-09-24': '대체공휴일',
    '2029-10-03': '개천절', '2029-10-09': '한글날', '2029-12-25': '성탄절',
    '2030-01-01': '신정', '2030-02-02': '설날', '2030-02-03': '설날', '2030-02-04': '설날', '2030-02-05': '대체공휴일',
    '2030-03-01': '삼일절', '2030-05-01': '노동절', '2030-05-05': '어린이날', '2030-05-06': '대체공휴일',
    '2030-05-09': '부처님오신날', '2030-06-06': '현충일', '2030-07-17': '제헌절', '2030-08-15': '광복절',
    '2030-09-11': '추석', '2030-09-12': '추석', '2030-09-13': '추석', '2030-10-03': '개천절',
    '2030-10-09': '한글날', '2030-12-25': '성탄절'
  };

  var storageOk = true;
  var data = load();
  var view = new Date(); view.setDate(1);
  var lastDay = ymd(new Date());

  // ---------- 저장 ----------
  function defaults() {
    return {
      className: '우리 반',
      events: [],
      ddays: [{ id: uid(), name: '수능', date: '2026-11-19', main: true }],
      notices: [],
      noticePw: '0000',
      holiOff: {},
      memo: ''
    };
  }
  function load() {
    try {
      var raw = window.localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        var def = defaults();
        for (var k in def) { if (!(k in d)) d[k] = def[k]; }
        return d;
      }
    } catch (e) { storageOk = false; }
    return defaults();
  }
  function save() {
    try { window.localStorage.setItem(KEY, JSON.stringify(data)); storageOk = true; }
    catch (e) { storageOk = false; }
    renderFoot();
  }

  // ---------- 유틸 ----------
  function uid() { return 'x' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function daysBetween(a, b) { return Math.round((parse(b) - parse(a)) / 86400000); }
  function ddayLabel(target) {
    var n = daysBetween(ymd(new Date()), target);
    if (n === 0) return 'D-day';
    return n > 0 ? 'D-' + n : 'D+' + (-n);
  }
  function korDate(s) { var d = parse(s); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WEEK[d.getDay()] + ')'; }
  function $(id) { return document.getElementById(id); }

  // ---------- 화면 ----------
  function renderClock() {
    var now = new Date();
    $('nowDate').textContent = now.getFullYear() + '년 ' + (now.getMonth() + 1) + '월 ' + now.getDate() + '일 ' + WEEK[now.getDay()] + '요일';
    $('nowTime').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
    var today = ymd(now);
    if (today !== lastDay) { lastDay = today; view = new Date(); view.setDate(1); renderAll(); fetchMeal(); }
  }

  function renderHeader() { $('className').textContent = data.className; }

  function evEnd(e) { return e.end && e.end > e.date ? e.end : e.date; }
  function builtinHoli(key) { return (data.holiOff && data.holiOff[key]) ? '' : (HOLIDAYS[key] || ''); }
  function holiNamesFor(key) {
    var names = [], b = builtinHoli(key);
    if (b) names.push(b);
    for (var i = 0; i < data.events.length; i++) {
      var e = data.events[i];
      if (e.red && e.date <= key && key <= evEnd(e)) names.push(e.text);
    }
    return names;
  }

  function renderCalendar() {
    var y = view.getFullYear(), m = view.getMonth();
    $('calTitle').textContent = y + '년 ' + (m + 1) + '월';
    var first = new Date(y, m, 1);
    var start = new Date(y, m, 1 - first.getDay());
    var dim = new Date(y, m + 1, 0).getDate();
    var weeks = Math.ceil((first.getDay() + dim) / 7);
    var today = ymd(new Date());

    var byDate = {};
    var evs = data.events.slice().sort(function (a, b) {
      var ra = a.end && a.end > a.date ? 0 : 1, rb = b.end && b.end > b.date ? 0 : 1;
      if (ra !== rb) return ra - rb;
      return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
    });
    for (var i = 0; i < evs.length; i++) {
      if (evs[i].red) continue;
      var ev = evs[i], end = ev.end && ev.end > ev.date ? ev.end : ev.date;
      var c = parse(ev.date), guard = 0;
      while (ymd(c) <= end && guard++ < 120) {
        var kk = ymd(c);
        (byDate[kk] = byDate[kk] || []).push(ev);
        c = new Date(c.getFullYear(), c.getMonth(), c.getDate() + 1);
      }
    }

    var html = '';
    for (var w = 0; w < weeks; w++) {
      html += '<div class="week">';
      for (var d = 0; d < 7; d++) {
        var cur = new Date(start.getFullYear(), start.getMonth(), start.getDate() + w * 7 + d);
        var key = ymd(cur);
        var cls = 'day';
        if (cur.getMonth() !== m) cls += ' other';
        if (d === 0) cls += ' sun';
        if (d === 6) cls += ' sat';
        var hn = holiNamesFor(key);
        if (hn.length) cls += ' holi';
        if (key === today) cls += ' today';
        html += '<div class="' + cls + '" data-date="' + key + '">';
        html += '<span class="day-num">' + cur.getDate() + '</span>';
        if (hn.length) html += '<span class="holi-name">' + hn.map(esc).join(' · ') + '</span>';
        var list = byDate[key] || [];
        var max = weeks > 5 ? 2 : 3;
        for (var j = 0; j < list.length && j < max; j++) {
          var e = list[j], eEnd = e.end && e.end > e.date ? e.end : e.date;
          if (eEnd === e.date) { html += '<div class="ev">' + esc(e.text) + '</div>'; continue; }
          var ec = 'ev range';
          if (key === e.date || d === 0) ec += ' first'; else ec += ' cont';
          if (key === eEnd || d === 6) ec += ' last';
          html += '<div class="' + ec + '">' + esc(e.text) + '</div>';
        }
        if (list.length > max) html += '<div class="ev-more">+' + (list.length - max) + '개 더</div>';
        html += '</div>';
      }
      html += '</div>';
    }
    $('weeks').innerHTML = html;
  }

  function sortedDdays() {
    return data.ddays.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  }

  function renderDday() {
    var box = $('ddayBox');
    if (!data.ddays.length) {
      box.innerHTML = '<div class="panel-title">D-day</div><div class="empty">눌러서 D-day를 추가하세요.</div>';
      return;
    }
    var main = null, i;
    for (i = 0; i < data.ddays.length; i++) if (data.ddays[i].main) main = data.ddays[i];
    if (!main) main = sortedDdays()[0];
    var html = '<div class="dday-main"><div><div class="dday-name">' + esc(main.name) + '</div>' +
      '<div class="dday-date">' + parse(main.date).getFullYear() + '년 ' + korDate(main.date) + '</div></div>' +
      '<div class="dday-big">' + ddayLabel(main.date) + '</div></div>';
    var others = sortedDdays().filter(function (x) { return x.id !== main.id; });
    if (others.length) {
      html += '<div class="dday-list">';
      for (i = 0; i < others.length && i < 3; i++) {
        html += '<div class="dday-row">' + esc(others[i].name) + '<b>' + ddayLabel(others[i].date) + '</b></div>';
      }
      html += '</div>';
    }
    box.innerHTML = html;
  }

  function renderNotice() {
    var html = '<img class="mark" src="' + EMBLEM + '" alt=""><div class="panel-title">담임 전달사항<span class="lock">🔒</span></div>';
    if (!data.notices.length) {
      html += '<div class="empty">눌러서 전달사항을 적어 주세요.</div>';
    } else {
      for (var i = 0; i < data.notices.length; i++) html += '<div class="notice-item">' + esc(data.notices[i]) + '</div>';
    }
    $('noticeBox').innerHTML = html;
  }

  // ---------- 급식 ----------
  var meal = loadMeal();   // { code, fetchedFor, days: { 'YYYYMMDD': [{type, menu:[..]}] }, error }

  function loadMeal() {
    try { var raw = window.localStorage.getItem(MEAL_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return { code: '', fetchedFor: '', days: {}, error: '' };
  }
  var mealType = '중식';
  try { mealType = window.localStorage.getItem(MEAL_TYPE_KEY) || '중식'; } catch (e) {}

  function saveMeal() { try { window.localStorage.setItem(MEAL_KEY, JSON.stringify(meal)); } catch (e) {} }

  function neis(path, params, done) {
    var q = 'KEY=' + encodeURIComponent(getNeisKey()) + '&Type=json&pIndex=1&pSize=100';
    for (var k in params) q += '&' + k + '=' + encodeURIComponent(params[k]);
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'https://open.neis.go.kr/hub/' + path + '?' + q, true);
    xhr.timeout = 15000;
    xhr.onload = function () {
      var j = null;
      try { j = JSON.parse(xhr.responseText); } catch (e) { return done('응답을 읽을 수 없어요'); }
      if (j[path] && j[path][1] && j[path][1].row) return done(null, j[path][1].row);
      if (j.RESULT && j.RESULT.CODE === 'INFO-200') return done(null, []);
      done((j.RESULT && j.RESULT.MESSAGE) || '알 수 없는 오류');
    };
    xhr.onerror = function () { done('급식 서버에 연결할 수 없어요 (인터넷 또는 보안 제한)'); };
    xhr.ontimeout = function () { done('급식 서버 응답이 없어요'); };
    xhr.send();
  }

  function cleanMenu(str) {
    return String(str).split(/<br\s*\/?>/i).map(function (x) {
      return x.replace(/\([\d.\s]*\)/g, '').replace(/[*#@]+/g, '').replace(/\s*[\d.]+$/g, '').replace(/^\s+|\s+$/g, '');
    }).filter(function (x) { return x.length > 0; });
  }

  function compact(d) { return ymd(d).replace(/-/g, ''); }

  function fetchMeal() {
    if (!getNeisKey()) { meal.error = '급식 인증키가 아직 입력되지 않았어요'; renderMeal(); return; }
    var code = SCHOOL_CODE || meal.code;
    if (!code) {
      neis('schoolInfo', { ATPT_OFCDC_SC_CODE: OFFICE_CODE, SCHUL_NM: SCHOOL_NAME }, function (err, rows) {
        if (err) { meal.error = err; renderMeal(); return; }
        if (!rows.length) { meal.error = '학교를 찾지 못했어요'; renderMeal(); return; }
        meal.code = rows[0].SD_SCHUL_CODE; saveMeal(); fetchMeal();
      });
      return;
    }
    var from = new Date(), to = new Date(); to.setDate(to.getDate() + 10);
    neis('mealServiceDietInfo', {
      ATPT_OFCDC_SC_CODE: OFFICE_CODE, SD_SCHUL_CODE: code,
      MLSV_FROM_YMD: compact(from), MLSV_TO_YMD: compact(to)
    }, function (err, rows) {
      if (err) { meal.error = err; renderMeal(); return; }
      var days = {};
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        (days[r.MLSV_YMD] = days[r.MLSV_YMD] || []).push({ type: r.MMEAL_SC_NM, menu: cleanMenu(r.DDISH_NM) });
      }
      meal.days = days; meal.fetchedFor = compact(new Date()); meal.error = '';
      saveMeal(); renderMeal();
    });
  }

  function renderMeal() {
    var today = compact(new Date());
    var keys = [], k, j;
    for (k in meal.days) {
      if (k < today) continue;
      for (j = 0; j < meal.days[k].length; j++) if (meal.days[k][j].type === mealType) { keys.push(k); break; }
    }
    keys.sort();
    var tabs = '<button class="meal-tab' + (mealType === '중식' ? ' on' : '') + '" data-type="중식">중식</button>' +
      '<button class="meal-tab' + (mealType === '석식' ? ' on' : '') + '" data-type="석식">석식</button>';
    var html = '<div class="meal-head"><div class="panel-title">급식</div>';
    if (!keys.length) {
      html += '<div class="meal-when"></div>' + tabs + '</div><div class="empty">' +
        (meal.error ? esc(meal.error) : (meal.fetchedFor ? '예정된 ' + mealType + ' 정보가 없어요' : '급식 정보를 불러오는 중이에요')) + '</div>';
      $('mealBox').innerHTML = html; return;
    }
    var key = keys[0], item = null;
    for (j = 0; j < meal.days[key].length; j++) if (meal.days[key][j].type === mealType) item = meal.days[key][j];
    var d = parse(key.slice(0, 4) + '-' + key.slice(4, 6) + '-' + key.slice(6, 8));
    html += '<div class="meal-when">' + (key === today ? '오늘' : '다음 ' + mealType) + ' · ' + korDate(ymd(d)) + '</div>' + tabs + '</div>';
    html += '<div class="meal-menu">' + item.menu.map(esc).join('<span class="dot">·</span>') + '</div>';
    $('mealBox').innerHTML = html;
  }

  function renderFoot() {
    var f = $('foot');
    if (storageOk) { f.className = 'foot'; f.innerHTML = 'v' + VERSION + ' · 제작 : 서령고등학교 교사 <span class="admin-trig" id="adminTrig">고민식</span>'; }
    else { f.className = 'foot warn'; f.textContent = '이 브라우저는 저장이 꺼져 있어 새로고침하면 내용이 사라집니다. 브라우저 설정에서 웹 저장소를 켜 주세요.'; }
  }

  function renderAll() { renderHeader(); renderCalendar(); renderDday(); renderMeal(); renderNotice(); renderFoot(); }

  // ---------- 편집창 ----------
  function openModal(html) { $('modal').innerHTML = html; $('modalBg').className = 'modal-bg open'; }
  function closeModal() { $('modalBg').className = 'modal-bg'; $('modal').innerHTML = ''; }

  function dayModal(date, edit) {
    var list = data.events.filter(function (e) { return e.date <= date && date <= evEnd(e); });
    var b = builtinHoli(date);
    var html = '<h2>' + korDate(date) + '</h2>';
    if (!list.length && !b) html += '<div class="m-empty">등록된 일정이 없어요.</div>';
    if (b) {
      html += '<div class="m-row' + (edit && edit.type === 'holi' ? ' editing' : '') + '"><span><span class="tag-red">' + esc(b) + '</span><small>공휴일 (기본 목록)</small></span>' +
        '<button class="btn" data-act="editHoli" data-date="' + date + '">수정</button>' +
        '<button class="btn del" data-act="delHoli" data-date="' + date + '">삭제</button></div>';
    }
    for (var i = 0; i < list.length; i++) {
      var e = list[i], en = evEnd(e) !== e.date;
      var sub = (en ? korDate(e.date) + ' ~ ' + korDate(evEnd(e)) : '') + (e.red ? (en ? ' · ' : '') + '공휴일' : '');
      html += '<div class="m-row' + (edit && edit.id === e.id ? ' editing' : '') + '"><span>' + (e.red ? '<span class="tag-red">' + esc(e.text) + '</span>' : esc(e.text)) +
        (sub ? '<small>' + sub + '</small>' : '') + '</span>' +
        '<button class="btn" data-act="editEvent" data-id="' + e.id + '" data-date="' + date + '">수정</button>' +
        '<button class="btn del" data-act="delEvent" data-id="' + e.id + '" data-date="' + date + '">삭제</button></div>';
    }

    var f = { text: '', start: date, end: '', red: false };
    if (edit && edit.type === 'holi') f = { text: b, start: date, end: '', red: true };
    if (edit && edit.id) {
      for (i = 0; i < data.events.length; i++) if (data.events[i].id === edit.id) {
        var x = data.events[i];
        f = { text: x.text, start: x.date, end: evEnd(x) !== x.date ? evEnd(x) : '', red: !!x.red };
      }
    }
    html += '<div class="m-form"><input id="evText" type="text" placeholder="일정 내용 (예: 중간고사, 체육복 지참)" value="' + esc(f.text) + '"></div>' +
      '<div class="m-form m-dates"><label class="m-field"><span>시작일</span><input id="evStart" type="date" value="' + f.start + '"></label>' +
      '<label class="m-field"><span>끝나는 날 (여러 날 일정일 때만)</span><input id="evEnd" type="date" value="' + f.end + '"></label></div>' +
      '<label class="m-check"><input id="evRed" type="checkbox"' + (f.red ? ' checked' : '') + '>공휴일(빨간 날)로 표시</label>' +
      '<div class="m-actions">' +
      (edit ? '<button class="btn" data-act="cancelEdit" data-date="' + date + '">수정 취소</button>' : '<button class="btn" data-act="close">닫기</button>') +
      '<button class="btn primary" data-act="saveEvent" data-date="' + date + '"' +
      (edit && edit.id ? ' data-id="' + edit.id + '"' : '') + (edit && edit.type === 'holi' ? ' data-holi="' + date + '"' : '') + '>' +
      (edit ? '저장' : '추가') + '</button></div>';
    openModal(html);
  }

  function ddayModal() {
    var list = sortedDdays();
    var html = '<h2>D-day 관리</h2>';
    if (!list.length) html += '<div class="m-empty">등록된 D-day가 없어요.</div>';
    for (var i = 0; i < list.length; i++) {
      var d = list[i];
      html += '<div class="m-row"><span>' + esc(d.name) + '<small>' + d.date + ' · ' + ddayLabel(d.date) + '</small></span>' +
        '<button class="btn star' + (d.main ? ' on' : '') + '" data-act="mainDday" data-id="' + d.id + '">' + (d.main ? '대표' : '대표로') + '</button>' +
        '<button class="btn del" data-act="delDday" data-id="' + d.id + '">삭제</button></div>';
    }
    html += '<div class="m-form"><input id="ddName" type="text" placeholder="이름 (예: 2학기 기말고사)">' +
      '<input id="ddDate" type="date"><button class="btn primary" data-act="addDday">추가</button></div>' +
      '<div class="m-actions"><button class="btn" data-act="close">닫기</button></div>';
    openModal(html);
  }

  function noticeModal() {
    var html = '<h2>담임 전달사항</h2><div class="hint">한 줄에 하나씩 적어 주세요. 빈 줄은 무시돼요.</div>' +
      '<textarea id="noticeText">' + esc(data.notices.join('\n')) + '</textarea>' +
      '<div class="m-actions"><button class="btn" data-act="close">취소</button>' +
      '<button class="btn del" data-act="clearNotice">모두 지우기</button>' +
      '<button class="btn primary" data-act="saveNotice">저장</button></div>';
    openModal(html);
  }

  function pwModal() {
    var html = '<h2>담임 전달사항 수정</h2><div class="hint">비밀번호를 입력해 주세요.</div>' +
      '<div class="m-form"><input id="pwText" type="password" inputmode="numeric" maxlength="8" placeholder="비밀번호">' +
      '<button class="btn primary" data-act="checkPw">확인</button></div><div class="pw-err" id="pwErr"></div>' +
      '<div class="m-actions"><button class="btn" data-act="pwChange">비밀번호 변경</button><button class="btn" data-act="close">취소</button></div>';
    openModal(html);
    setTimeout(function () { var el = $('pwText'); if (el) el.focus(); }, 50);
  }

  function pwChangeModal() {
    var html = '<h2>전달사항 비밀번호 변경</h2><div class="hint">숫자 4~8자리로 정해 주세요.</div>' +
      '<div class="m-form"><input id="pwCur" type="password" inputmode="numeric" maxlength="8" placeholder="현재 비밀번호"></div>' +
      '<div class="m-form"><input id="pwNew" type="password" inputmode="numeric" maxlength="8" placeholder="새 비밀번호"></div>' +
      '<div class="m-form"><input id="pwNew2" type="password" inputmode="numeric" maxlength="8" placeholder="새 비밀번호 확인"></div>' +
      '<div class="pw-err" id="pwErr"></div>' +
      '<div class="m-actions"><button class="btn" data-act="close">취소</button><button class="btn primary" data-act="savePw">변경</button></div>';
    openModal(html);
    setTimeout(function () { var el = $('pwCur'); if (el) el.focus(); }, 50);
  }

  function adminModal() {
    var html = '<h2>admin</h2><div class="hint">관리자 비밀번호를 입력해 주세요.</div>' +
      '<div class="m-form"><input id="adminPw" type="password" inputmode="numeric" maxlength="8" placeholder="비밀번호">' +
      '<button class="btn primary" data-act="checkAdmin">확인</button></div><div class="pw-err" id="pwErr"></div>' +
      '<div class="m-actions"><button class="btn" data-act="close">닫기</button></div>';
    openModal(html);
    setTimeout(function () { var el = $('adminPw'); if (el) el.focus(); }, 50);
  }

  function adminKeyModal(msg) {
    var html = '<h2>admin · 급식 인증키</h2>' +
      '<div class="hint">NEIS 인증키를 입력하면 이 전자칠판에만 저장돼요. 파일에는 들어가지 않아요.</div>' +
      '<div class="m-form"><input id="neisKeyIn" type="text" autocomplete="off" placeholder="인증키" value="' + esc(getNeisKey()) + '"></div>' +
      '<div class="admin-ok" id="adminOk">' + (msg || '') + '</div>' +
      '<div class="m-actions"><button class="btn del" data-act="clearKey">지우기</button><button class="btn" data-act="close">닫기</button><button class="btn primary" data-act="saveKey">저장</button></div>';
    openModal(html);
  }

  function classModal() {
    var html = '<h2>반 이름</h2><div class="m-form"><input id="cnText" type="text" value="' + esc(data.className) + '"></div>' +
      '<div class="m-actions"><button class="btn" data-act="close">취소</button><button class="btn primary" data-act="saveClass">저장</button></div>';
    openModal(html);
  }

  // ---------- 동작 ----------
  var actions = {
    close: function () { closeModal(); },
    saveEvent: function (el) {
      var t = $('evText').value.replace(/^\s+|\s+$/g, '');
      if (!t) { $('evText').focus(); return; }
      var date = el.getAttribute('data-date');
      var st = $('evStart').value, en = $('evEnd').value, red = $('evRed').checked;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(st)) st = date;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(en) || en === st) en = '';
      if (en && en < st) { var tmp = st; st = en; en = tmp; }
      var id = el.getAttribute('data-id'), holi = el.getAttribute('data-holi');
      var ev = null;
      if (id) { for (var i = 0; i < data.events.length; i++) if (data.events[i].id === id) ev = data.events[i]; }
      if (!ev) { ev = { id: uid() }; data.events.push(ev); }
      ev.text = t; ev.date = st;
      if (en) ev.end = en; else delete ev.end;
      if (red) ev.red = true; else delete ev.red;
      if (holi) { data.holiOff = data.holiOff || {}; data.holiOff[holi] = true; }
      save(); renderCalendar(); dayModal(date);
    },
    editEvent: function (el) { dayModal(el.getAttribute('data-date'), { id: el.getAttribute('data-id') }); },
    editHoli: function (el) { dayModal(el.getAttribute('data-date'), { type: 'holi' }); },
    cancelEdit: function (el) { dayModal(el.getAttribute('data-date')); },
    delHoli: function (el) {
      var d = el.getAttribute('data-date');
      data.holiOff = data.holiOff || {}; data.holiOff[d] = true;
      save(); renderCalendar(); dayModal(d);
    },
    delEvent: function (el) {
      var id = el.getAttribute('data-id');
      data.events = data.events.filter(function (e) { return e.id !== id; });
      save(); renderCalendar(); dayModal(el.getAttribute('data-date'));
    },
    addDday: function () {
      var n = $('ddName').value.replace(/^\s+|\s+$/g, ''), d = $('ddDate').value;
      if (!n) { $('ddName').focus(); return; }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { $('ddDate').focus(); return; }
      data.ddays.push({ id: uid(), name: n, date: d, main: data.ddays.length === 0 });
      save(); renderDday(); ddayModal();
    },
    delDday: function (el) {
      var id = el.getAttribute('data-id');
      data.ddays = data.ddays.filter(function (x) { return x.id !== id; });
      save(); renderDday(); ddayModal();
    },
    mainDday: function (el) {
      var id = el.getAttribute('data-id');
      for (var i = 0; i < data.ddays.length; i++) data.ddays[i].main = data.ddays[i].id === id;
      save(); renderDday(); ddayModal();
    },
    saveNotice: function () {
      data.notices = $('noticeText').value.split('\n')
        .map(function (s) { return s.replace(/^\s+|\s+$/g, ''); })
        .filter(function (s) { return s.length > 0; });
      save(); renderNotice(); closeModal();
    },
    clearNotice: function () { $('noticeText').value = ''; },
    pwChange: function () { pwChangeModal(); },
    checkAdmin: function () {
      if ($('adminPw').value === ADMIN_PW) { adminKeyModal(); }
      else { $('pwErr').textContent = '비밀번호가 맞지 않아요.'; $('adminPw').value = ''; $('adminPw').focus(); }
    },
    saveKey: function () {
      var k = $('neisKeyIn').value.replace(/^\s+|\s+$/g, '');
      setNeisKey(k);
      meal.error = ''; fetchMeal();
      adminKeyModal(k ? '저장됐어요. 급식을 다시 불러와요.' : '인증키를 지웠어요.');
    },
    clearKey: function () { setNeisKey(''); meal.days = {}; meal.error = ''; saveMeal(); renderMeal(); adminKeyModal('인증키를 지웠어요.'); },
    savePw: function () {
      var cur = $('pwCur').value, n1 = $('pwNew').value, n2 = $('pwNew2').value, err = $('pwErr');
      if (cur !== (data.noticePw || '0000')) { err.textContent = '현재 비밀번호가 맞지 않아요.'; return; }
      if (!/^\d{4,8}$/.test(n1)) { err.textContent = '새 비밀번호는 숫자 4~8자리로 해 주세요.'; return; }
      if (n1 !== n2) { err.textContent = '새 비밀번호 두 개가 서로 달라요.'; return; }
      data.noticePw = n1; save(); closeModal();
    },
    checkPw: function () {
      if ($('pwText').value === (data.noticePw || '0000')) { noticeModal(); }
      else { $('pwErr').textContent = '비밀번호가 맞지 않아요.'; $('pwText').value = ''; $('pwText').focus(); }
    },
    saveClass: function () {
      var t = $('cnText').value.replace(/^\s+|\s+$/g, '');
      if (t) { data.className = t; save(); renderHeader(); }
      closeModal();
    }
  };

  $('modal').addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== this && !el.getAttribute('data-act')) el = el.parentNode;
    if (el && el !== this && actions[el.getAttribute('data-act')]) actions[el.getAttribute('data-act')](el);
  });
  $('modal').addEventListener('keydown', function (e) {
    if (e.keyCode !== 13 || e.target.tagName === 'TEXTAREA') return;
    var btn = this.querySelector('.m-form .btn.primary') || this.querySelector('.m-actions .btn.primary');
    if (btn) btn.click();
  });
  $('modalBg').addEventListener('click', function (e) { if (e.target === this) closeModal(); });

  $('weeks').addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== this && !el.getAttribute('data-date')) el = el.parentNode;
    if (el && el !== this) dayModal(el.getAttribute('data-date'));
  });
  $('ddayBox').addEventListener('click', ddayModal);
  $('mealBox').addEventListener('click', function (e) {
    var t = e.target.getAttribute && e.target.getAttribute('data-type');
    if (!t) return;
    mealType = t;
    try { window.localStorage.setItem(MEAL_TYPE_KEY, t); } catch (err) {}
    renderMeal();
  });
  $('foot').addEventListener('click', function (e) { if (e.target && e.target.id === 'adminTrig') adminModal(); });
  $('noticeBox').addEventListener('click', pwModal);
  $('brand').addEventListener('click', classModal);
  $('prevBtn').addEventListener('click', function () { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); renderCalendar(); });
  $('nextBtn').addEventListener('click', function () { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); renderCalendar(); });
  $('todayBtn').addEventListener('click', function () { view = new Date(); view.setDate(1); renderCalendar(); });

  // ---------- 스톱워치·타이머 ----------
  var tmMode = 'sw';
  var sw = { running: false, base: 0, start: 0 };            // 누적 ms, 시작 시각
  var tm = { set: 0, left: 0, running: false, end: 0, done: false };
  var tmTick = null, audioCtx = null, beepTimer = null, tmInputVer = 0;

  function now() { return new Date().getTime(); }
  function swElapsed() { return sw.base + (sw.running ? now() - sw.start : 0); }
  function tmLeft() { return tm.running ? Math.max(0, tm.end - now()) : tm.left; }

  function fmtSw(ms) {
    var t = Math.floor(ms / 100), d = t % 10, s = Math.floor(t / 10), m = Math.floor(s / 60), h = Math.floor(m / 60);
    var main = (h ? h + ':' + pad(m % 60) : pad(m)) + ':' + pad(s % 60);
    return { main: main, sub: '.' + d };
  }
  function fmtTm(ms) {
    var s = Math.ceil(ms / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60);
    return (h ? h + ':' + pad(m % 60) : pad(m)) + ':' + pad(s % 60);
  }

  function beep() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      var t0 = audioCtx.currentTime;
      for (var i = 0; i < 3; i++) {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'square'; o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, t0 + i * 0.3);
        g.gain.exponentialRampToValueAtTime(0.35, t0 + i * 0.3 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.3 + 0.2);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t0 + i * 0.3); o.stop(t0 + i * 0.3 + 0.22);
      }
    } catch (e) {}
  }
  function unlockAudio() {   // 터치한 순간 오디오를 깨워 둬야 구형 WebView에서도 소리가 남
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC && !audioCtx) audioCtx = new AC();
      if (audioCtx && audioCtx.resume) audioCtx.resume();
    } catch (e) {}
  }

  function tmDone() {
    tm.running = false; tm.left = 0; tm.done = true;
    tmMode = 'tm'; openTm();
    beep();
    var n = 0;
    clearInterval(beepTimer);
    beepTimer = setInterval(function () { if (++n >= 9 || !tm.done) { clearInterval(beepTimer); return; } beep(); }, 1500);
  }

  function ensureTick() {
    if (tmTick) return;
    tmTick = setInterval(function () {
      if (tm.running && tmLeft() <= 0) tmDone();
      if (!sw.running && !tm.running && !$('tmBg').className.match(/open/)) { clearInterval(tmTick); tmTick = null; }
      renderTm();
    }, 100);
  }

  function renderToolBtn() {
    var b = $('toolBtn'), txt = '';
    if (tm.running) txt = fmtTm(tmLeft());
    else if (sw.running) txt = fmtSw(swElapsed()).main;
    b.className = 'tool-btn' + (txt ? ' running' : '');
    $('toolRun').textContent = txt;
  }

  function renderTm() {
    renderToolBtn();
    if (!$('tmBg').className.match(/open/)) return;
    var tabs = document.querySelectorAll('.tm-tab');
    for (var i = 0; i < tabs.length; i++) tabs[i].className = 'tm-tab' + (tabs[i].getAttribute('data-tm') === tmMode ? ' on' : '');
    var dg = $('tmDigits'), label = '', presets = '', ctrls = '';
    if (tmMode === 'sw') {
      var f = fmtSw(swElapsed());
      dg.className = 'tm-digits';
      dg.innerHTML = f.main + '<small>' + f.sub + '</small>';
      label = '';
      ctrls = '<button class="tm-btn go" data-act="swToggle">' + (sw.running ? '멈춤' : (swElapsed() ? '계속' : '시작')) + '</button>' +
        '<button class="tm-btn" data-act="swReset"' + (swElapsed() && !sw.running ? '' : ' disabled') + '>초기화</button>';
    } else {
      var left = tmLeft();
      dg.className = 'tm-digits' + (tm.done ? ' done' : (tm.running && left <= 10000 ? ' warn' : ''));
      dg.textContent = tm.done ? '00:00' : fmtTm(left);
      var idle = !tm.running && !tm.done && tm.left === tm.set;
      label = tm.done ? '시간 종료!' : (idle ? '분과 초를 입력하고 시작을 누르세요' : '');
      if (idle) {
        var setS = Math.round(tm.set / 1000);
        presets = '<div class="tm-inputs" data-v="' + tmInputVer + '">' +
          '<input id="tmMin" type="number" inputmode="numeric" min="0" max="99" placeholder="0" value="' + (setS ? Math.floor(setS / 60) : '') + '"><span>분</span>' +
          '<input id="tmSec" type="number" inputmode="numeric" min="0" max="59" placeholder="0" value="' + (setS ? setS % 60 : '') + '"><span>초</span></div>';
      }
      if (tm.done) ctrls = '<button class="tm-btn go" data-act="tmOk">확인</button>';
      else ctrls = '<button class="tm-btn go" data-act="tmToggle"' + (left ? '' : ' disabled') + '>' + (tm.running ? '멈춤' : (left < tm.set && left ? '계속' : '시작')) + '</button>' +
        '<button class="tm-btn" data-act="tmReset"' + (tm.running || !left || left === tm.set ? ' disabled' : '') + '>초기화</button>';
    }
    $('tmLabel').textContent = label;
    $('tmLabel').className = 'tm-label' + (tmMode === 'tm' && tm.done ? ' done' : '');
    var pk = tmMode + (presets.indexOf('tm-inputs') >= 0 ? 'in' + tmInputVer : presets);
    if ($('tmPresets').getAttribute('data-k') !== pk) { $('tmPresets').innerHTML = presets; $('tmPresets').setAttribute('data-k', pk); }
    if ($('tmCtrls').getAttribute('data-k') !== ctrls) { $('tmCtrls').innerHTML = ctrls; $('tmCtrls').setAttribute('data-k', ctrls); }
  }

  function openTm() { $('tmBg').className = 'tm-bg open'; ensureTick(); renderTm(); }
  function closeTm() { $('tmBg').className = 'tm-bg'; if (tm.done) { tm.done = false; tm.left = tm.set; tmInputVer++; } renderTm(); }

  var tmActions = {
    swToggle: function () {
      if (sw.running) { sw.base += now() - sw.start; sw.running = false; }
      else { sw.start = now(); sw.running = true; }
    },
    swReset: function () { sw.base = 0; sw.running = false; },
    tmAdd: function (el) {
      var sec = +el.getAttribute('data-sec');
      if (el.getAttribute('data-add') === '1') { tm.left = Math.min(tm.left + sec * 1000, 99 * 60000 + 59000); }
      else tm.left = sec * 1000;
      tm.set = tm.left;
    },
    tmToggle: function () {
      if (tm.running) { tm.left = tmLeft(); tm.running = false; }
      else if (tm.left > 0) { tm.end = now() + tm.left; tm.running = true; }
    },
    tmReset: function () { tm.running = false; tm.left = tm.set; tmInputVer++; },
    tmOk: function () { tm.done = false; tm.left = tm.set; tmInputVer++; clearInterval(beepTimer); }
  };

  function readTmInputs() {
    var mi = $('tmMin'), se = $('tmSec');
    if (!mi || !se) return;
    var m = parseInt(mi.value, 10) || 0, sec = parseInt(se.value, 10) || 0;
    m = Math.max(0, Math.min(99, m)); sec = Math.max(0, Math.min(59, sec));
    tm.set = tm.left = (m * 60 + sec) * 1000;
    renderTm();
  }
  $('tmPresets').addEventListener('input', readTmInputs);
  $('tmPresets').addEventListener('keydown', function (e) {
    if (e.keyCode !== 13) return;
    readTmInputs();
    if (e.target.blur) e.target.blur();
    if (tm.left > 0 && !tm.running) { unlockAudio(); tmActions.tmToggle(); ensureTick(); renderTm(); }
  });

  $('toolBtn').addEventListener('click', function () { unlockAudio(); openTm(); });
  $('tmClose').addEventListener('click', closeTm);
  $('tmBg').addEventListener('click', function (e) {
    unlockAudio();
    var el = e.target;
    while (el && el !== this && !el.getAttribute('data-act') && !el.getAttribute('data-tm')) el = el.parentNode;
    if (!el || el === this) return;
    if (el.getAttribute('data-tm')) { tmMode = el.getAttribute('data-tm'); }
    else if (tmActions[el.getAttribute('data-act')]) tmActions[el.getAttribute('data-act')](el);
    ensureTick(); renderTm();
  });

  renderAll();
  renderClock();
  setInterval(renderClock, 5000);
  fetchMeal();
  setInterval(fetchMeal, 30 * 60 * 1000);
})();
</script>
